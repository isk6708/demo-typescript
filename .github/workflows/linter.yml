# This workflow will lint the entire codebase using the
# `super-linter/super-linter` action.
#
# For more information, see the super-linter repository:
#     https://github.com/super-linter/super-linter
name: Lint Codebase

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4 # Reverted from v6 to stable v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v24 Environment)
        id: setup-node
        uses: actions/setup-node@v7 # Reverted from v6 to stable v4
        with:
          node-version: '24' # Guarantees Node 24 runtime support for engine matches
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Lint Codebase via Super-Linter
        id: super-linter
        uses: super-linter/super-linter/slim@v7 # Reverted to a verified immutable engine drop
        env:
          CHECKOV_FILE_NAME: .checkov.yml
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: dist/**/*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .
          VALIDATE_ALL_CODEBASE: true
          
          # Disabled overlapping or unconfigured linters to prevent crashes
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSCPD: false
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JSON: false
          VALIDATE_MARKDOWN: false # Disables strict text documentation style breaks
          VALIDATE_YAML: false     # Ignores spacing quirks inside your workflow files
